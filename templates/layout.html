<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="initial-scale=1, width=device-width" />

		<link
			crossorigin="anonymous"
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
			integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
			rel="stylesheet"
		/>
		<script
			crossorigin="anonymous"
			src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
		></script>

		<style>
			:root {
				--mahogany: #4a1c1c;
				--parchment: #fdfaf1;
				--shelf-gold: #c6b884;
				--accent-red: #8b0000;
			}

			body {
				background-color: var(--parchment);
				color: #2c2c2c;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			}

			a {
				text-decoration: none;
				transition: color 0.2s;
			}

			/* Navbar Redesign */
			.navbar {
				background-color: var(--shelf-gold) !important;
				border-bottom: 4px solid var(--mahogany);
				padding: 0.75rem 0;
			}

			.navbar-brand {
				color: var(--accent-red) !important;
				font-weight: 800;
				letter-spacing: 2px;
				font-size: 1.5rem;
			}

			.nav-link {
				color: var(--mahogany) !important;
				font-weight: 500;
				margin: 0 5px;
			}

			.nav-link:hover {
				color: var(--accent-red) !important;
				opacity: 0.8;
			}

			/* Custom Dropdown for Search */
			.dropdown-menu {
				background-color: var(--parchment) !important;
				border: 2px solid var(--mahogany) !important;
				box-shadow: 0 4px 10px rgba(0,0,0,0.15);
			}

			/* Main Content Area */
			main {
				flex: 1 0 auto;
			}

			/* Footer Redesign */
			footer {
				height: 15vh;
				width: 100%;
				background-image: url('/static/shelf-filled-with-books-.png');
				background-position: center;
				background-size: cover;
				border-top: 5px solid var(--mahogany);
				position: relative;
				margin-top: auto;
			}

			.footer-tag {
				background-color: rgba(198, 184, 132, 0.9);
				color: var(--mahogany);
				padding: 0.5rem 1.5rem;
				border-radius: 5px;
				font-weight: bold;
				border: 1px solid var(--mahogany);
			}

			/* Utility Classes */
			.btn-primary {
				background-color: var(--mahogany) !important;
				border-color: var(--mahogany) !important;
			}

			.btn-primary:hover {
				background-color: var(--accent-red) !important;
			}
		</style>
		
		<title>Bookshelf: {% block title %}{% endblock %}</title>
	</head>

	<body>
		<nav class="navbar navbar-expand-md navbar-light sticky-top">
			<div class="container-fluid px-4">
				<a class="navbar-brand" href="/">BOOKSHELF</a>
				
				<button
					aria-controls="navbar"
					aria-expanded="false"
					aria-label="Toggle navigation"
					class="navbar-toggler"
					data-bs-target="#navbar"
					data-bs-toggle="collapse"
					type="button"
				>
					<span class="navbar-toggler-icon"></span>
				</button>

				<div class="collapse navbar-collapse" id="navbar">
					{% if session["user_id"] %}
					<ul class="navbar-nav me-auto">
						<li class="nav-item dropdown">
							<a
								class="nav-link dropdown-toggle"
								data-bs-toggle="dropdown"
								href="#"
								role="button"
								aria-expanded="false"
								>Find</a
							>
							<ul class="dropdown-menu p-3">
								<form action="/" method="get">
									<div class="input-group">
										<input
											class="form-control"
											name="find"
											placeholder="Search..."
											type="text"
										/>
										<button class="btn btn-primary" type="submit">Go!</button>
									</div>
								</form>
							</ul>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/browse">Browse</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/add_book">Add Book</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/add_bookshelf">Add Shelf</a>
						</li>
					</ul>
					
					<ul class="navbar-nav ms-auto align-items-center">
						<li class="nav-item">
							<a class="nav-link btn btn-outline-secondary btn-sm px-3 mx-2 mb-2 mb-md-0" href="{{url_for('index', borrowed=true)}}">Borrowed</a>
						</li>
						<li class="nav-item">
							<a class="nav-link btn btn-outline-primary btn-sm px-3 mx-2 mb-2 mb-md-0" href="{{url_for('index', random=true)}}">Surprise me!</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/logout">Log Out</a>
						</li>
					</ul>
					{% else %}
					<ul class="navbar-nav ms-auto">
						<li class="nav-item">
							<a class="nav-link" href="/register">Register</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/login">Log In</a>
						</li>
					</ul>
					{% endif %}
				</div>
			</div>
		</nav>

		<main class="container-fluid py-5">
			{% block main %}{% endblock %}
		</main>

		<footer class="d-flex align-items-center justify-content-center">
			<div class="footer-tag">Made by Tahir Mujic</div>
		</footer>

		{% block script %}{% endblock %}
	</body>
</html>
