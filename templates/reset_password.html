{% extends "layout.html" %}
{% block title %} Reset Password {% endblock %}

{% block main %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 50vh;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 15px; border-top: 6px solid var(--mahogany); background-color: #fff;">
        <h3 class="text-center fw-bold mb-3" style="color: var(--mahogany);">New Password</h3>
        <p class="text-center text-muted small">Resetting password for: <strong>{{ username }}</strong></p>

        <form action="{{ url_for('reset_password', token=token) }}" method="post">
            <div class="form-floating mb-3">
                <input class="form-control" id="new-password" name="new-password" placeholder="New Password" type="password" required>
                <label for="new-password">New Password</label>
            </div>
            <div class="form-floating mb-4">
                <input class="form-control" id="repeat-password" name="confirmation" placeholder="Confirm Password" type="password" required>
                <label for="repeat-password">Confirm Password</label>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Update Password</button>
        </form>
        <p class="mt-3 text-danger small text-center">{{ message }}</p>
    </div>
</div>
{% endblock %}
