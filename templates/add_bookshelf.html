{% extends "layout.html" %}
{% block title %} Build a Shelf {% endblock %}

{% block main %}
<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 60vh;">
    <div class="text-center mb-4">
        <h2 class="fw-bold" style="color: var(--mahogany);">Build a New Shelf</h2>
        <p class="text-muted">{{ message }}</p>
    </div>

    <div class="card shadow-lg p-4" style="width: 100%; max-width: 500px; border-radius: 15px; border-top: 6px solid var(--mahogany); background-color: #fff;">
        <form action="/add_bookshelf" enctype="multipart/form-data" method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input class="form-control" autocomplete="off" name="width" id="sWidth" placeholder="Width" type="number" min="1" max="100" required />
                        <label for="sWidth">Slots per shelf (wide)</label>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating mb-3">
                        <input class="form-control" autocomplete="off" name="height" id="sHeight" placeholder="Height" type="number" min="1" max="100" required />
                        <label for="sHeight">Number of shelves (high)</label>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-floating mb-3">
                        <input class="form-control" autocomplete="off" name="description" id="sName" placeholder="Shelf Name" maxlength="80" required />
                        <label for="sName">Shelf Name (e.g., Living Room Main)</label>
                    </div>
                </div>

                <div class="col-12 mb-4">
                    <label class="form-label small fw-bold text-muted">Photo of the shelf <span class="fw-normal">(optional)</span></label>
                    <div class="input-group">
                        <input accept="image/jpeg,image/png,image/gif,image/webp" class="form-control" name="image" id="sImage" type="file" />
                    </div>
                    <div id="preview-container" class="mt-3 text-center d-none">
                        <img id="image-preview" src="#" alt="Preview" class="img-thumbnail" style="max-height: 200px;">
                    </div>
                </div>

                <div class="col-12">
                    <button class="btn btn-primary w-100 py-2 fw-bold" name="add" type="submit">
                        Construct Shelf
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
    document.getElementById('sImage').onchange = function () {
        const [file] = this.files;
        if (file) {
            document.getElementById('image-preview').src = URL.createObjectURL(file);
            document.getElementById('preview-container').classList.remove('d-none');
        }
    };
</script>
{% endblock %}
