{% extends "layout.html" %}
{% block title %} Forgot Password {% endblock %}

{% block main %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 50vh;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px; border-radius: 15px; border-top: 6px solid var(--mahogany); background-color: #fff;">
        <h3 class="text-center fw-bold mb-2" style="color: var(--mahogany);">Forgot Password</h3>
        <p class="text-center text-muted small">Enter the email you registered with and we'll send you a reset link.</p>

        {% if message %}
            <div class="alert alert-warning py-2 small text-center" role="alert">{{ message }}</div>
        {% endif %}

        <form action="/forgot_password" method="post">
            <div class="form-floating mb-4">
                <input class="form-control" id="email" name="email" placeholder="Email" type="email" autocomplete="email" required>
                <label for="email">Email address</label>
            </div>
            <button class="btn btn-primary w-100 py-2 fw-bold" type="submit">Send link</button>
        </form>

        <p class="text-center small mt-4 mb-0">
            <a href="/login" class="text-muted">Back to sign in</a>
        </p>
    </div>
</div>
{% endblock %}
