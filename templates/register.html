{% extends "layout.html" %} 
{% block title %} Register {% endblock %} 

{% block main %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 55vh;">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 450px; border-radius: 15px; border-top: 6px solid var(--mahogany); background-color: #fff;">
        
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: var(--mahogany);">Create Account</h3>
            <p class="text-muted small">Join the Bookshelf community</p>
        </div>

        {% if message %}
            <div class="alert alert-warning py-2 small text-center" role="alert">
                {{ message }}
            </div>
        {% endif %}

        <form action="/register" method="post">
            <div class="form-floating mb-3">
                <input 
                    type="text" 
                    name="username" 
                    class="form-control" 
                    id="rUsername" 
                    placeholder="Username" 
                    autocomplete="off" 
                    autofocus 
                    required
                >
                <label for="rUsername">Username</label>
            </div>

            <div class="form-floating mb-3">
                <input 
                    type="email" 
                    name="user-email" 
                    class="form-control" 
                    id="rEmail" 
                    placeholder="Email Address" 
                    required
                >
                <label for="rEmail">Email Address</label>
            </div>

            <div class="form-floating mb-3">
                <input 
                    type="password" 
                    name="password" 
                    class="form-control" 
                    id="rPassword" 
                    placeholder="Password" 
                    required
                >
                <label for="rPassword">Password</label>
            </div>

            <div class="form-floating mb-4">
                <input 
                    type="password" 
                    name="confirmation" 
                    class="form-control" 
                    id="rConfirm" 
                    placeholder="Confirm Password" 
                    required
                >
                <label for="rConfirm">Confirm Password</label>
            </div>

            <div class="d-grid">
                <button class="btn btn-primary py-2 fw-bold" type="submit">
                    Register Now
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <p class="small mb-0">
                Already have an account? <a href="/login" class="text-decoration-none" style="color: var(--mahogany);">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
